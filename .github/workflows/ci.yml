name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Windows / Node 22
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Builds, then runs the deterministic suite: no provider CLI, network access or Docker daemon is needed.
      - name: Test
        run: npm test

      # Packs this checkout, installs the tarball into a private prefix and runs the installed CLI. Never publishes.
      - name: Package smoke
        run: node scripts/pack-smoke.mjs --worktree
