name: Bug report
description: Report a reproducible Fusion CLI defect
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not include credentials, tokens, account identifiers, or other secrets.
        Security vulnerabilities should follow SECURITY.md instead of a public issue.

  - type: input
    id: version
    attributes:
      label: Commit or version
      placeholder: e.g. 7e3e0e6
    validations:
      required: true

  - type: textarea
    id: behavior
    attributes:
      label: Actual behavior
      description: What happened?
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Minimal steps to reproduce without secrets.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Node version, Git version, and relevant non-sensitive runtime details.
