name: Feature request
description: Propose a scoped Fusion CLI improvement
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem should this solve?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - CLI / control plane
        - Workflow / policy
        - Workspace / verification
        - Review / adjudication
        - Provider adapter
        - Runtime / process supervision
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: invariants
    attributes:
      label: Safety / architecture impact
      description: Does this affect provider neutrality, capability routing, Writer mode, Git safety, or verification authority?
