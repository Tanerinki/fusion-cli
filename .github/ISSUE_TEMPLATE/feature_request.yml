name: Feature request
description: Propose a scoped Fusion CLI improvement
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: What should Fusion do? Commands, options or output, if you have them in mind.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Chat / Analyze
        - Build / Create
        - Delivery / Apply
        - Verification / Docker
        - Provider adapter
        - Review / adjudication
        - History / evidence
        - CLI / config
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: invariants
    attributes:
      label: Safety and architecture impact
      description: Would this touch provider neutrality, host-owned mutation, confined verification, the human confirmation or approval boundary, evidence/redaction, or Git safety? How would those stay intact?

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
